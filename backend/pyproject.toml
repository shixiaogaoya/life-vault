[project]
name = "lifevault-backend"
version = "0.2.0"
description = "LifeVault Backend - Personal Message Archive System"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # httpx 用于 AI provider（OpenAI/Anthropic/Ollama）的 HTTP 调用；
    # 这些 provider 在模块导入时即引用 httpx，因此即使是禁用 AI 的部署也必须安装。
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
